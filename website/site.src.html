const PIECES = [["tag", "بطاقة شنطة"], ["pencil", "اسم القلم"], ["ruler", "مسطرة ١٥ سم"], ["bottle", "بطاقة قنينة"]];
const COLOUR_NAMES = { black: "أسود", yellow: "أصفر", orange: "برتقالي", white: "أبيض", pink: "وردي", lpink: "وردي فاتح" };
const state = { theme: "construction", colours: "4", pieces: new Set(PIECES.map((p) => p[0])), name: "OMAR" };
const ceilTo = (v, s) => Math.ceil(v / s - 1e-9) * s;
function priceFor() {
  const c = DATA.themes[state.theme].colours[state.colours], all = PIECES.map((p) => p[0]), sel = all.filter((k) => state.pieces.has(k));
  if (!sel.length) return { price: 0, pack: false };
  if (sel.length === all.length) return { price: c.pack, pack: true };
  const total = all.reduce((a, k) => a + c.costs[k], 0), part = sel.reduce((a, k) => a + c.costs[k], 0);
  return { price: Math.min(c.pack, ceilTo(c.pack * (part / total) * DATA.premium, DATA.step)), pack: false };
}

function seg(el, name, items, current, onPick) {

  const href = link(text);
  if (href) { btn.href = href; btn.removeAttribute("aria-disabled"); btn.hidden = false; if (!API) note.textContent = "بيفتح واتساب والرسالة جاهزة، بس اضغط إرسال. نرجعلك بمعاينة قبل الطباعة."; }
  else { btn.href = "#"; btn.setAttribute("aria-disabled", "true"); if (!API) note.textContent = "رقم الواتساب لسا ما انضاف للموقع. انسخ الطلب وابعتلنا إياه على فيسبوك أو الإيميل أسفل الصفحة."; }
}
async function copy(text, btn) {
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = "تم النسخ"; } catch (e) { btn.textContent = "انسخه يدوياً"; }
  setTimeout(() => (btn.textContent = old), 1800);
}
async function post(path, body) {
  const r = await fetch(API + path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  return r.json().catch(() => ({ ok: false, error: "تعذّر الاتصال، جرّب مرة ثانية." }));
}
function showErr(el, msg) { el.textContent = msg; el.hidden = !msg; }
function okBox(el, j, extra) {
  el.hidden = false;
  el.innerHTML = `<b>وصلنا طلبك</b><div class="code">${j.code}</div>${j.total != null ? `<p>المجموع: ${money(j.total)} دينار</p>` : ""}<p>${extra}</p><p class="hint">احفظ رقم الطلب. بتقدر تتبّعه من صفحة "تواصل معنا".</p>`;
}
function trackBox() {
  return `<form class="box" id="trackForm" onsubmit="return false"><h3>تتبّع طلبك</h3><div class="grid2"><div class="field"><label for="tCode">رقم الطلب</label><input id="tCode" type="text" placeholder="ZT-1001" dir="ltr" autocomplete="off"></div>
  <div class="field"><label for="tPhone">رقم الهاتف</label><input id="tPhone" type="tel" dir="ltr" autocomplete="tel"></div></div><div class="row"><button class="btn primary" id="tGo" type="button">تتبّع</button></div><p id="tOut" class="hint" aria-live="polite"></p></form>`;
}
function bindTrack() {
  const go = $("tGo"); if (!go) return;
  go.onclick = async () => {
    const out = $("tOut"); out.className = "hint"; out.textContent = "…";
    const r = await fetch(`${API}/track?id=${encodeURIComponent($("tCode").value)}&phone=${encodeURIComponent($("tPhone").value)}`).then((x) => x.json()).catch(() => ({ ok: false, error: "تعذّر الاتصال." }));
    out.className = r.ok ? "hint" : "hint err"; out.textContent = r.ok ? `${r.code}: ${r.statusText}` : r.error;
  };
}

/* ---------- router: bare hash tokens (home, products, shop, contact, c-<cat>, p-<product>) ---------- */
function route() {
  const t = (location.hash || "#home").slice(1) || "home", main = $("main");
  let html, after, nav = "home", title = "3D ZONE TECH";
  if (VIEWS[t]) { html = VIEWS[t](); nav = t; if (t === "contact") after = bindTrack; }
  else if (t.startsWith("c-") && CATS.find((c) => c.id === t.slice(2))) { const c = CATS.find((x) => x.id === t.slice(2)); html = catView(c); nav = "products"; title = c.name; }
  else if (t.startsWith("p-") && P[t.slice(2)]) { const pid = t.slice(2); nav = "products"; title = P[pid][0];
    if (pid === "pack") { html = packView(); after = bindPack; } else { html = genericView(pid); after = () => bindAsk(pid); } }
  else { html = VIEWS.home(); }
  main.innerHTML = html; document.title = title === "3D ZONE TECH" ? title : `${title} · 3D ZONE TECH`;
  document.querySelectorAll("[data-nav]").forEach((a) => (a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  $("nav").classList.remove("open"); $("burger").setAttribute("aria-expanded", "false");
  if (after) after();
  window.scrollTo(0, 0);
}
$("burger").onclick = () => { const o = $("nav").classList.toggle("open"); $("burger").setAttribute("aria-expanded", String(o)); };
$("themeBtn").onclick = () => { const r = document.documentElement, light = r.dataset.theme !== "light"; r.dataset.theme = light ? "light" : "dark"; $("themeBtn").textContent = light ? "☾" : "☀"; };
addEventListener("hashchange", route); route();
</script>
