name = "3dzonetech-site"
main = "worker/index.js"
compatibility_date = "2026-09-24"

# the static site (index.html, admin.html, img/) is served from ./public
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# orders live in D1:  npx wrangler d1 create 3dzonetech   (paste the database_id below)
[[d1_databases]]
binding = "DB"
database_name = "3dzonetech"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

# secrets (set with `npx wrangler secret put NAME`):
#   ADMIN_TOKEN          required: password for /admin.html
#   TELEGRAM_BOT_TOKEN   optional: Telegram ping on every new order
#   TELEGRAM_CHAT_ID     optional
