<title>اتجاهات التصميم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Kufi+Arabic:wght@500;700&display=swap">
<style>
/* Layout concept: the agreed home page (intro, services, catalogue, vision, contact) drawn three times in three visual
   worlds, one under the other, so they can be compared. The page around them stays neutral. */
:root { --bg: #F1F3F7; --fg: #101B30; --muted: #5A6785; --line: #D6DDEA;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0B1222; --fg: #E8EEFA; --muted: #9AA8C6; --line: #22345B; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0B1222; --fg: #E8EEFA; --muted: #9AA8C6; --line: #22345B; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.65 var(--f-body); }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 1.8rem 3rem; display: grid; gap: 2.6rem; }
h1 { font: 800 clamp(1.7rem, 4vw, 2.4rem)/1.2 "Baloo Bhaijaan 2", sans-serif; margin: 0; }
.intro p { color: var(--muted); max-width: 46rem; margin: .5rem 0 0; }
.dhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem 1rem; margin-bottom: .8rem; }
.dhead b { font: 600 1.3rem "Baloo Bhaijaan 2", sans-serif; } .dhead span { color: var(--muted); font-size: .92rem; }
.frame { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; direction: rtl; }
.note { margin-top: .7rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: .6rem; font-size: .9rem; color: var(--muted); }
.note div { border-inline-start: 3px solid var(--line); padding-inline-start: .7rem; } .note b { color: var(--fg); display: block; }
.sw { display: flex; gap: .4rem; margin-top: .5rem; } .sw i { width: 28px; height: 28px; border-radius: 6px; border: 1px solid rgba(128,128,128,.4); }
.ph { display: grid; place-items: center; text-align: center; font: 400 .78rem var(--f-mono); }

/* shared skeleton inside every frame */
.m-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .8rem 1.2rem; flex-wrap: wrap; }
.m-top nav { display: flex; gap: 1.2rem; font-size: .92rem; flex-wrap: wrap; }
.m-logo { direction: ltr; white-space: nowrap; }
.m-hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 1.6rem; padding: 2.2rem 1.3rem; align-items: center; }
.m-hero h2 { margin: 0; } .m-hero p { margin: .7rem 0 0; }
.m-svc { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1rem; }
.m-svc span { padding: .35rem .9rem; font-size: .9rem; }
.m-hero .ph { aspect-ratio: 4 / 3; }
.m-sec { padding: 1.6rem 1.3rem; } .m-sec > h3 { margin: 0 0 1rem; }
.m-cat { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .9rem; }
.m-card { padding: .8rem; display: grid; gap: .5rem; align-content: start; } .m-card .ph { aspect-ratio: 4 / 3; } .m-card h4 { margin: 0; }
.m-card small { font-size: .78rem; opacity: .7; }
.m-soon { opacity: .75; } .m-soon .badge { justify-self: start; font: 500 .72rem var(--f-mono); padding: .05rem .6rem; border: 1px dashed currentColor; border-radius: 99px; }
.m-vis { padding: 1.8rem 1.3rem; } .m-vis p { margin: 0; max-width: 40rem; }
.m-foot { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: 1rem 1.3rem; font-size: .88rem; }
@media (max-width: 720px) { .m-hero { grid-template-columns: minmax(0, 1fr); } }

/* A: blueprint */
.A { background: #0C1A33 repeating-linear-gradient(to bottom, transparent 0 23px, rgba(80,120,200,.12) 23px 24px); color: #EAF1FF; }
.A .m-top { border-bottom: 1px solid #27427A; } .A .m-logo { font: 800 1.3rem "Baloo Bhaijaan 2"; } .A .m-logo em { color: #FF7A1A; font-style: normal; }
.A h2 { font: 800 clamp(1.8rem, 4vw, 2.7rem)/1.15 "Baloo Bhaijaan 2"; } .A h2 em { color: #FF7A1A; font-style: normal; } .A p { color: #9CB0D6; }
.A .m-svc span { border: 1px solid #FF7A1A; color: #FF7A1A; font-family: var(--f-mono); }
.A .ph { background: #12254A; border: 1px solid #27427A; color: #6F8CC4; } .A .m-sec > h3, .A .m-vis h3 { font: 600 1.3rem "Baloo Bhaijaan 2"; }
.A .m-card { background: #12254A; border: 1px solid #27427A; } .A .m-card h4 { font: 600 1.05rem "Baloo Bhaijaan 2"; }
.A .m-vis { border-block: 1px solid #27427A; background: rgba(18,37,74,.6); } .A .m-foot { color: #9CB0D6; }

/* B: playful */
.B { background: #FFF8EC; color: #14213D; }
.B .m-top { background: #14213D; color: #fff; } .B .m-logo { font: 800 1.35rem "Baloo Bhaijaan 2"; } .B .m-logo em { color: #FF7A1A; font-style: normal; }
.B h2 { font: 800 clamp(2rem, 5vw, 3.2rem)/1.05 "Baloo Bhaijaan 2"; } .B h2 mark { background: #FF7A1A; color: #14213D; padding: 0 .4rem; border-radius: 10px; } .B p { color: #43506D; }
.B .m-svc span { background: #fff; border: 3px solid #14213D; border-radius: 99px; font-weight: 600; box-shadow: 0 3px 0 #14213D; }
.B .ph { background: #FFE2C2; border: 3px solid #14213D; border-radius: 22px; color: #8A5A25; }
.B .m-sec > h3, .B .m-vis h3 { font: 800 1.6rem "Baloo Bhaijaan 2"; }
.B .m-card { background: #fff; border: 3px solid #14213D; border-radius: 22px; box-shadow: 0 5px 0 #14213D; } .B .m-card h4 { font: 700 1.15rem "Baloo Bhaijaan 2"; }
.B .m-vis { background: #FF7A1A; color: #14213D; } .B .m-vis p { color: #14213D; font-weight: 500; } .B .m-foot { background: #14213D; color: #fff; }

/* C: showroom */
.C { background: #FAFAF9; color: #17181B; }
.C .m-top { border-bottom: 1px solid #E3E3E0; } .C .m-logo { font: 700 1.1rem "Noto Kufi Arabic"; letter-spacing: .06em; } .C .m-logo em { color: #E8661A; font-style: normal; }
.C h2 { font: 700 clamp(1.7rem, 3.6vw, 2.5rem)/1.4 "Noto Kufi Arabic"; } .C p { color: #6A6D75; }
.C .m-svc span { border: 1px solid #17181B; border-radius: 2px; }
.C .ph { background: #EFEFEC; color: #9A9DA5; } .C .m-sec > h3, .C .m-vis h3 { font: 700 1.2rem "Noto Kufi Arabic"; }
.C .m-card { padding: 0; } .C .m-card h4 { font: 500 1rem "Noto Kufi Arabic"; } .C .m-vis { background: #17181B; color: #fff; } .C .m-vis p { color: #D6D7DB; }
.C .m-foot { border-top: 1px solid #E3E3E0; color: #6A6D75; }
</style>

<div class="wrap">
  <div class="intro">
    <h1>اتجاهات تصميم الصفحة الرئيسية</h1>
    <p>الهيكلة هي اللي اتفقنا عليها: تعريف، خدمات، كاتالوج (الطابعات والفيلامنت "قريباً")، نظرة الشركة، تواصل. الشعار مكتوب بحروفه لحد ما تبعت الملف، والصور مربعات مكان لحد ما نصور شغل حقيقي. النصوص مسودة مني.</p>
  </div>
  <div id="out"></div>
</div>

<script>
const CATS = [["مصابيح", "لمبات وديكور مضيء"], ["ديكور وأكسسوارات", "قطع بيت ومكتب"], ["قطع حسب طلبك", "من فكرتك أو من قطعة مكسورة"], ["قطع سيارات", "BMW · Mercedes · EV"], ["هدايا ومنتجات شخصية", "باسمك وبألوانك"]];
const SOON = [["طابعات وقطعها", "قريباً"], ["فيلامنت", "قريباً"]];
const DIRS = [
  ["A", "A · مخطط هندسي", "داكن، شبكة خطوط، شكل ورشة تقنية",
   ["يناسب", "الشباب وأصحاب السيارات، وصورة الشركة مصنع تقني دقيق."], ["يضعف", "أقل دفئاً مع الأهل، والداكن بيحتاج انتباه للقراءة."], ["#0C1A33", "#12254A", "#FF7A1A", "#EAF1FF"]],
  ["B", "B · لعوب وملوّن", "فاتح، أزرار بارزة وحروف منفوخة زي شعارك",
   ["يناسب", "الأهل والطلاب والهدايا، بيشبه شعارك المنفوخ."], ["يضعف", "أقل جدية لقطع السيارات والمتجر الكبير لاحقاً."], ["#FFF8EC", "#14213D", "#FF7A1A", "#FFE2C2"]],
  ["C", "C · معرض هادي", "مساحات بيضاء، صور كبيرة، بيكبر لمتجر كامل",
   ["يناسب", "شركة موثوقة وبعدين متجر (طابعات، فيلامنت)، وبيصلح لبيع خارج الأردن."], ["يضعف", "أبرد وأقل شخصية، وبيحتاج صور حقيقية حتى يبيّن حلو."], ["#FAFAF9", "#17181B", "#E8661A", "#EFEFEC"]],
];
function frame(c) {
  return `<div class="frame ${c}">
  <div class="m-top"><span class="m-logo">3D ZONE <em>TECH</em></span><nav><span>الرئيسية</span><span>منتجاتنا</span><span>المتجر</span><span>تواصل معنا</span></nav></div>
  <div class="m-hero"><div>${c === "B" ? "<h2>أي فكرة… <mark>نطبعها</mark> ونمسحها</h2>" : c === "A" ? "<h2>فكرتك بإيدك… <em>طبقة طبقة</em></h2>" : "<h2>طباعة وسكانر ثلاثي الأبعاد، من الفكرة للقطعة</h2>"}
    <p>3D ZONE TECH في إربد وعمّان: نصمم ونطبع بالألوان، ونمسح القطع بالسكانر ثلاثي الأبعاد.</p>
    <div class="m-svc"><span>طباعة 3D</span><span>سكانر 3D</span></div></div>
    <div class="ph">صورة أو فيديو من الطباعة</div></div>
  <div class="m-sec"><h3>شو بنقدّم</h3><div class="m-cat">
    ${CATS.map(([n, d]) => `<div class="m-card"><div class="ph">صورة القسم</div><h4>${n}</h4><small>${d}</small></div>`).join("")}
    ${SOON.map(([n, d]) => `<div class="m-card m-soon"><div class="ph">صورة القسم</div><h4>${n}</h4><span class="badge">${d}</span></div>`).join("")}
  </div></div>
  <div class="m-vis"><h3>نظرتنا</h3><p>نحوّل الفكرة لقطعة حقيقية، بدقة وبألوان، من أول رسمة لحد باب البيت. (نص مسودة)</p></div>
  <div class="m-foot"><span>3dzonetech@gmail.com</span><span>facebook.com/3dzonetech</span><span>إربد · عمّان</span></div>
</div>`;
}
document.getElementById("out").innerHTML = DIRS.map(([c, t, d, a, b, sw]) => `<section style="margin-bottom:2.6rem"><div class="dhead"><b>${t}</b><span>${d}</span></div>${frame(c)}
<div class="note"><div><b>${a[0]}</b>${a[1]}</div><div><b>${b[0]}</b>${b[1]}</div></div><div class="sw">${sw.map((x) => `<i style="background:${x}"></i>`).join("")}</div></section>`).join("");
</script>
