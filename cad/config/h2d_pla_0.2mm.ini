# Approximation of a Bambu Lab H2D (single nozzle area), 0.4 mm nozzle, PLA, 0.2 mm layers.
# Used here for slicing checks and time/filament estimates only. For printing, slice the STL
# in Bambu Studio with the settings in README (its G-code is printer-specific).
bed_shape = 0x0,325x0,325x320,0x320
max_print_height = 325
nozzle_diameter = 0.4
filament_diameter = 1.75
gcode_flavor = marlin2
layer_height = 0.2
first_layer_height = 0.2
extrusion_width = 0.42
perimeter_extrusion_width = 0.42
external_perimeter_extrusion_width = 0.42
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = gyroid
elefant_foot_compensation = 0.15
temperature = 220
first_layer_temperature = 220
bed_temperature = 55
first_layer_bed_temperature = 55
filament_type = PLA
filament_density = 1.24
filament_cost = 20
support_material = 0
skirts = 0
brim_width = 0
perimeter_speed = 200
external_perimeter_speed = 150
small_perimeter_speed = 150
infill_speed = 250
solid_infill_speed = 200
top_solid_infill_speed = 150
gap_fill_speed = 150
travel_speed = 400
first_layer_speed = 50
machine_max_acceleration_extruding = 10000
machine_max_acceleration_travel = 10000
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
default_acceleration = 8000
perimeter_acceleration = 5000
infill_acceleration = 8000
first_layer_acceleration = 500
