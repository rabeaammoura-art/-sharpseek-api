# Bambu Lab H2D, 0.4mm nozzle, ASA, 0.2mm layers.
# Bed = single (left) nozzle printable area 325x320, height 325. Enclosed + heated chamber.
# PrusaSlicer is used here only to check fit, filament weight and print time;
# the real print file comes from Bambu Studio (import out/<part>.3mf or .step).
bed_shape = 0x0,325x0,325x320,0x320
max_print_height = 325
nozzle_diameter = 0.4
filament_diameter = 1.75
gcode_flavor = marlin2
layer_height = 0.2
first_layer_height = 0.2
perimeters = 4
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 25%
fill_pattern = gyroid
temperature = 260
first_layer_temperature = 260
bed_temperature = 100
first_layer_bed_temperature = 100
filament_type = ASA
filament_density = 1.07
filament_cost = 30
# ASA warps: low part cooling and a brim.
cooling = 1
min_fan_speed = 10
max_fan_speed = 30
bridge_fan_speed = 50
disable_fan_first_layers = 3
brim_width = 5
skirts = 0
support_material = 0
perimeter_speed = 60
infill_speed = 100
travel_speed = 200
first_layer_speed = 25
