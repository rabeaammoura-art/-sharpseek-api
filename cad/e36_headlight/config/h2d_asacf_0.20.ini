# APPROXIMATE Bambu Lab H2D + ASA-CF profile for PrusaSlicer 2.7 (time/mass ESTIMATES only).
# Real production slicing must be redone in Bambu Studio with the official H2D + Bambu ASA-CF profiles.
# Build volume: Bambu spec, single-nozzle printing 325 x 320 x 325 mm.
bed_shape = 0x0,325x0,325x320,0x320
max_print_height = 325
nozzle_diameter = 0.4
filament_diameter = 1.75
gcode_flavor = marlin2
layer_height = 0.2
first_layer_height = 0.2
perimeters = 4
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = gyroid
infill_anchor = 2
temperature = 270
first_layer_temperature = 270
bed_temperature = 100
first_layer_bed_temperature = 100
filament_type = ASA
# density: Bambu ASA-CF TDS lists ~1.12 g/cm3 (verify on the spool's TDS)
filament_density = 1.12
# cost per kg: ASSUMED, set your local price
filament_cost = 40
filament_max_volumetric_speed = 18
support_material = 1
support_material_auto = 1
support_material_threshold = 40
support_material_contact_distance = 0.2
support_material_spacing = 2.5
support_material_style = organic
skirts = 0
brim_width = 0
external_perimeter_speed = 120
perimeter_speed = 180
small_perimeter_speed = 60
infill_speed = 220
solid_infill_speed = 180
top_solid_infill_speed = 120
support_material_speed = 150
bridge_speed = 50
gap_fill_speed = 100
travel_speed = 500
first_layer_speed = 40
default_acceleration = 6000
perimeter_acceleration = 5000
external_perimeter_acceleration = 3000
infill_acceleration = 8000
travel_acceleration = 10000
first_layer_acceleration = 500
machine_max_acceleration_extruding = 10000
machine_max_acceleration_travel = 10000
machine_max_acceleration_x = 10000
machine_max_acceleration_y = 10000
machine_max_feedrate_x = 600
machine_max_feedrate_y = 600
machine_max_feedrate_z = 30
machine_max_jerk_x = 9
machine_max_jerk_y = 9
