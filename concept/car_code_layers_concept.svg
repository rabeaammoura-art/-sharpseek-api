<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"><defs>
<mask id="mBody"><rect x="0" y="0" width="800" height="260" fill="#fff"/><path d="M214,148 Q250,110 305,102 L462,102 Q516,106 556,146 Z" fill="#000" stroke="#000"/><path d="M130,226 A60,60 0 0 1 250,226 Z" fill="#000" stroke="#000"/><path d="M550,226 A60,60 0 0 1 670,226 Z" fill="#000" stroke="#000"/><path d="M92,188 Q300,172 700,184" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/><path d="M330,230 L560,230" stroke="#000" stroke-width="0"/></mask>
<mask id="mDet"><rect x="0" y="0" width="800" height="260" fill="#fff"/><g/></mask>
<filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="6" dy="9" stdDeviation="5" flood-color="#000" flood-opacity=".55"/></filter>
<filter id="sh2" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#000" flood-opacity=".5"/></filter>
<mask id="mw190"><rect x="0" y="0" width="800" height="260" fill="#fff"/><rect x="184" y="184" width="12" height="28" rx="6" fill="#000" transform="rotate(0 190 226)"/><rect x="184" y="184" width="12" height="28" rx="6" fill="#000" transform="rotate(72 190 226)"/><rect x="184" y="184" width="12" height="28" rx="6" fill="#000" transform="rotate(144 190 226)"/><rect x="184" y="184" width="12" height="28" rx="6" fill="#000" transform="rotate(216 190 226)"/><rect x="184" y="184" width="12" height="28" rx="6" fill="#000" transform="rotate(288 190 226)"/><circle cx="190" cy="226" r="9" fill="#000"/></mask><mask id="mw610"><rect x="0" y="0" width="800" height="260" fill="#fff"/><rect x="604" y="184" width="12" height="28" rx="6" fill="#000" transform="rotate(0 610 226)"/><rect x="604" y="184" width="12" height="28" rx="6" fill="#000" transform="rotate(72 610 226)"/><rect x="604" y="184" width="12" height="28" rx="6" fill="#000" transform="rotate(144 610 226)"/><rect x="604" y="184" width="12" height="28" rx="6" fill="#000" transform="rotate(216 610 226)"/><rect x="604" y="184" width="12" height="28" rx="6" fill="#000" transform="rotate(288 610 226)"/><circle cx="610" cy="226" r="9" fill="#000"/></mask></defs>
<rect width="1600" height="1000" fill="#efe9df"/>
<text x="800" y="64" font-family="Helvetica,Arial,sans-serif" font-size="38" font-weight="700" fill="#222" text-anchor="middle">Car Code Layers — concept</text>
<text x="800" y="98" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#555" text-anchor="middle">Layered hollow wall art · each layer reveals one part of the car's design</text>
<text x="60" y="150" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#222" text-anchor="start">1 · Exploded view (layers)</text>
<g transform="translate(50,200) matrix(0.62,0,-0.2,0.62,0,0)" filter="url(#sh2)"><rect x="10" y="60" width="780" height="190" rx="10" fill="#fff" fill-opacity="0.0" stroke="#999" stroke-dasharray="8 6"/><path d="M40,210 L40,182 Q46,166 82,161 L190,151 Q232,100 302,88 L470,88 Q542,92 592,140 L700,153 Q750,161 760,186 L762,212 Q762,224 750,226 L50,226 Q40,226 40,210 Z" fill="#1b1f2a"/></g>
<text x="570" y="310" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#333" text-anchor="start">Layer 1: silhouette (back plate)</text>
<g transform="translate(130,300) matrix(0.62,0,-0.2,0.62,0,0)" filter="url(#sh2)"><rect x="10" y="60" width="780" height="190" rx="10" fill="#fff" fill-opacity="0.35" stroke="#999" stroke-dasharray="8 6"/><path d="M40,210 L40,182 Q46,166 82,161 L190,151 Q232,100 302,88 L470,88 Q542,92 592,140 L700,153 Q750,161 760,186 L762,212 Q762,224 750,226 L50,226 Q40,226 40,210 Z" fill="#c0392b" mask="url(#mBody)"/></g>
<text x="650" y="410" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#333" text-anchor="start">Layer 2: body, windows &amp; lines cut out</text>
<g transform="translate(210,400) matrix(0.62,0,-0.2,0.62,0,0)" filter="url(#sh2)"><rect x="10" y="60" width="780" height="190" rx="10" fill="#fff" fill-opacity="0.35" stroke="#999" stroke-dasharray="8 6"/><path d="M722,160 L752,170 L752,178 L716,172 Z" fill="#ffd54a"/><path d="M44,176 L62,168 L66,178 L44,186 Z" fill="#ff5a4d"/><path d="M708,196 L752,196 M708,203 L752,203 M708,210 L752,210" stroke="#222" stroke-width="3"/><path d="M300,108 L300,146 M470,106 L470,146" stroke="#c0392b" stroke-width="0"/><path d="M246,168 L420,166 M440,166 L520,168" stroke="#222" stroke-width="2.5" fill="none"/><path d="M508,146 L540,150 L536,158 L506,156 Z" fill="#222"/></g>
<text x="730" y="510" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#333" text-anchor="start">Layer 3: lights, grille, details</text>
<g transform="translate(290,500) matrix(0.62,0,-0.2,0.62,0,0)" filter="url(#sh2)"><rect x="10" y="60" width="780" height="190" rx="10" fill="#fff" fill-opacity="0.35" stroke="#999" stroke-dasharray="8 6"/><g mask="url(#mw190)"><circle cx="190" cy="226" r="50" fill="#e8e8e8"/></g><g mask="url(#mw610)"><circle cx="610" cy="226" r="50" fill="#e8e8e8"/></g></g>
<text x="810" y="610" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#333" text-anchor="start">Layer 4: wheels</text>
<text x="1000" y="150" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#222" text-anchor="start">2 · Assembled (4–6 mm spacers)</text>
<g transform="translate(940,200) scale(0.7)"><rect x="-25" y="-35" width="880" height="400" rx="14" fill="#2a2118"/><rect x="-12" y="-22" width="854" height="374" rx="8" fill="#d8cfc0"/><g transform="translate(20,40)"><g transform="translate(0,0)" filter="url(#sh2)" ><path d="M40,210 L40,182 Q46,166 82,161 L190,151 Q232,100 302,88 L470,88 Q542,92 592,140 L700,153 Q750,161 760,186 L762,212 Q762,224 750,226 L50,226 Q40,226 40,210 Z" fill="#1b1f2a"/></g><g transform="translate(5,-4)" filter="url(#sh)" ><path d="M40,210 L40,182 Q46,166 82,161 L190,151 Q232,100 302,88 L470,88 Q542,92 592,140 L700,153 Q750,161 760,186 L762,212 Q762,224 750,226 L50,226 Q40,226 40,210 Z" fill="#c0392b" mask="url(#mBody)"/></g><g transform="translate(10,-8)" filter="url(#sh2)" ><path d="M722,160 L752,170 L752,178 L716,172 Z" fill="#ffd54a"/><path d="M44,176 L62,168 L66,178 L44,186 Z" fill="#ff5a4d"/><path d="M708,196 L752,196 M708,203 L752,203 M708,210 L752,210" stroke="#222" stroke-width="3"/><path d="M300,108 L300,146 M470,106 L470,146" stroke="#c0392b" stroke-width="0"/><path d="M246,168 L420,166 M440,166 L520,168" stroke="#222" stroke-width="2.5" fill="none"/><path d="M508,146 L540,150 L536,158 L506,156 Z" fill="#222"/></g><g transform="translate(10,-8)" filter="url(#sh2)" ><g mask="url(#mw190)"><circle cx="190" cy="226" r="50" fill="#e8e8e8"/></g><g mask="url(#mw610)"><circle cx="610" cy="226" r="50" fill="#e8e8e8"/></g></g></g></g>
<text x="1230" y="560" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#555" text-anchor="middle">Shadows between layers create the depth</text>
<text x="60" y="760" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#222" text-anchor="start">Materials</text>
<text x="60" y="805" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#333" text-anchor="start">• Printed on your Bambu H2D: 1.2–2 mm per layer, a different filament color per layer (no painting)</text>
<text x="60" y="839" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#333" text-anchor="start">• Or CNC/laser-cut 3 mm plywood/MDF for a wood look</text>
<text x="60" y="873" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#333" text-anchor="start">• 4–6 mm spacers between layers + frame → real depth, optional LED strip behind (Premium)</text>
<text x="60" y="907" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#333" text-anchor="start">• Sizes: A4 / A3 · 3–6 layers · Custom: customer's own car from a photo</text>
<text x="800" y="960" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#777" text-anchor="middle">Illustrative generic coupe — real models would be traced from official side/front views</text>
</svg>